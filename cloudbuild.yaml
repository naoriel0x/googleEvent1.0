steps:
  # 1. Build Docker image dari Dockerfile di atas
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/web-app:$COMMIT_SHA', '.']

  # 2. Push image container-nya ke Container Registry Google
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/web-app:$COMMIT_SHA']

  # 3. Deploy langsung image tersebut ke Cloud Run Jakarta
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'developmentweb-service' # Ini akan jadi nama service Cloud Run kamu
      - '--image'
      - 'gcr.io/$PROJECT_ID/web-app:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2' # Menggunakan server Jakarta biar latensinya rendah
      - '--allow-unauthenticated' # Akses publik biar bisa dibuka semua orang